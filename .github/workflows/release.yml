# Release pipeline — builds the `crucible-llm` binary for each supported OS and
# attaches it to the GitHub release for the tag.
#
# Trigger 1 (normal): push a tag `vX.Y.Z` → this workflow builds all matrix
# targets and uploads each artifact to the release for that tag.
# Trigger 2 (manual): Actions → "Release" → Run workflow. Optionally supply
# `tag` to back-fill binaries for an existing tag (e.g. v0.1.7); if left empty,
# the latest tag is used.
#
# Artifact naming: crucible-llm-v<VERSION>-<target>.{tar.gz|zip}
#   linux/macos → .tar.gz, windows → .zip (PowerShell Compress-Archive)
#
# NOTE: an optional second macOS entry (x86_64-apple-darwin, for Intel Macs)
# can be added by appending one pair to each matrix list below:
#   os:     [..., macos-latest]
#   target: [..., x86_64-apple-darwin]

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.1.7). Leave empty to use the latest tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not kill the others.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            # Manual run with an explicit tag (back-fill).
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Normal tag-push run.
            VERSION="${GITHUB_REF_NAME}"
          else
            # Manual run with no tag given: fall back to the latest tag.
            VERSION="$(git describe --tags --abbrev=0)"
          fi
          # Strip the leading 'v' if present.
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package artifact
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="crucible-llm.exe"
            ARTIFACT="dist/crucible-llm-v${VERSION}-${TARGET}.zip"
            powershell -NoProfile -Command \
              "Compress-Archive -Path 'target/${TARGET}/release/${BIN}' -DestinationPath '${ARTIFACT}'"
          else
            BIN="crucible-llm"
            ARTIFACT="dist/crucible-llm-v${VERSION}-${TARGET}.tar.gz"
            tar -cz "${ARTIFACT}" -C "target/${TARGET}/release" "${BIN}"
          fi
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit tag so manual/back-fill runs target the right release.
          # The action creates the release if the tag has none yet.
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/*
