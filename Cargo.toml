[package]
name = "crucible-llm"
version = "0.1.3"
edition = "2021"
description = "High-performance terminal LLM benchmark & inference profiler"
license = "GPL-3.0-or-later"
repository = "https://github.com/MadGoatHaz/crucible-llm"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"
# Async engine
tokio = { version = "1.53", features = ["full"] }
# Networking / SSE
reqwest = { version = "0.13", features = ["json", "stream", "http2"] }
futures-util = "0.3"
# Tokenization (optional at runtime)
tokenizers = "0.23"
# Timing & statistics
quanta = "0.13"
hdrhistogram = "7.6"
# Hardware monitoring (feature-gated)
sysinfo = "0.39"
nvml-wrapper = { version = "0.13", optional = true }
# Level Zero Sysman (Intel Arc): dlopen'd at runtime via libloading, never
# link-dependent — the binary works on non-Intel machines without the
# Level Zero loader (graceful None fallback to the sysfs backend).
libloading = "0.8"
# Persistence
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps `--json` key order identical to the prototype's
# `output_json` (indexmap-backed maps instead of sorted BTreeMaps).
serde_json = { version = "1.0", features = ["preserve_order"] }
# Concurrency plumbing
crossbeam-channel = "0.5"
arc-swap = "1.7"
# Utilities
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
dirs = "5"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["nvml"]
nvml = ["dep:nvml-wrapper"]

[profile.release]
# The standalone release binary (plan Chunk 19): thin LTO + a single
# codegen unit for cross-crate optimization, stripped symbols, no debug
# info. `panic = "abort"` is deliberately NOT set — the TUI relies on
# `catch_unwind` to guarantee terminal restore, so unwind stays enabled.
# Zero runtime dependencies: SQLite is bundled (no system lib). NVML is on
# by default (`nvml` default feature); build without it via
# `--no-default-features` (blueprint §3).
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
